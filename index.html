<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jackpot Words">
  <meta name="description" content="A neon slot-machine word guessing game. No ads, works offline.">
  <title>Jackpot Words</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="app">
    <header id="topbar">
      <div class="bar-side">
        <button class="icon-btn" id="btn-help" aria-label="How to play">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.9v.6"/><circle cx="12" cy="17.3" r=".6" class="fill"/></svg>
        </button>
        <button class="icon-btn" id="btn-sound" aria-label="Sound on or off">
          <svg viewBox="0 0 24 24" class="snd-on"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg viewBox="0 0 24 24" class="snd-off"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
      <div class="logo" aria-label="Jackpot Words">
        <span class="logo-chrome">JACKPOT</span><span class="logo-script">Words</span>
      </div>
      <div class="bar-side right">
        <button class="icon-btn" id="btn-stats" aria-label="Stats">
          <svg viewBox="0 0 24 24"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5"/></svg>
        </button>
      </div>
    </header>

    <nav id="subbar">
      <div class="seg mini" id="seg-len" role="group" aria-label="Word length">
        <button data-len="5">5</button><button data-len="6">6</button><button data-len="7">7</button>
      </div>
      <div class="seg mini" id="seg-diff" role="group" aria-label="Difficulty">
        <button data-diff="easy">EASY</button><button data-diff="normal">NORMAL</button><button data-diff="hard">HARD</button>
      </div>
      <button class="chip" id="btn-new">NEW WORD</button>
      <span class="chip badge" id="badge-daily" hidden>DAILY</span>
    </nav>

    <main id="board-area" aria-label="Game board"></main>

    <section id="controls">
      <div id="hint" aria-live="polite"></div>
      <div class="controls-inner">
        <div id="keyboard" aria-label="Keyboard"></div>
        <div id="lever" role="button" aria-label="Pull the lever to spin" aria-disabled="true">
          <div class="lever-plate"></div>
          <div class="lever-slot"></div>
          <div class="lever-shaft"></div>
          <div class="lever-knob"><div class="lever-lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div></div>
          <div class="lever-label">PULL</div>
        </div>
      </div>
    </section>
  </div>

  <div id="toast-layer" aria-live="polite"></div>
  <div id="banner" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <div id="splash">
    <div class="splash-inner">
      <div class="logo big"><span class="logo-chrome">JACKPOT</span><span class="logo-script">Words</span></div>
      <div class="splash-tag">THE NEON WORD SLOT MACHINE</div>
      <button id="btn-start" class="start-btn" disabled>LOADING…</button>
      <div class="splash-foot">No ads. No internet needed. Just words.</div>
    </div>
  </div>

  <noscript><p style="color:#fff;text-align:center;margin-top:40vh">Jackpot Words needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
